[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
startsecs=5
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.log

[program:nginx]
command=/usr/local/openresty/bin/openresty -g "daemon off;"
autostart=true
autorestart=true
priority=20
startsecs=3
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log

[program:crond]
command=/usr/sbin/crond -f -l 8
autostart=true
autorestart=true
priority=30
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/crond.log
stderr_logfile=/var/log/supervisor/crond.log

[program:nuxt]
command=/bin/sh /data/httpd/ECShopX/docker-lite/web-entrypoint.sh
autostart=true
autorestart=true
priority=40
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/nuxt.log
stderr_logfile=/var/log/supervisor/nuxt.log
directory=/data/httpd/ECShopX_web-frontend
